<svg viewBox="0 0 380 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Bridge Icon -->
  <g transform="translate(0, 0)">
    <!-- Orb Finial -->
    <circle cx="45" cy="12" r="5.5" fill="#00C26F" />
    
    <!-- Central Mast -->
    <line x1="45" y1="17" x2="45" y2="62" stroke="#00C26F" stroke-width="3.5" stroke-linecap="round" />
    
    <!-- Left Cables -->
    <line x1="45" y1="19" x2="5" y2="62" stroke="#00C26F" stroke-width="2.5" stroke-linecap="round" />
    <line x1="45" y1="19" x2="18" y2="62" stroke="#00C26F" stroke-width="2.5" stroke-linecap="round" />
    <line x1="45" y1="19" x2="31" y2="62" stroke="#00C26F" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Right Cables -->
    <line x1="45" y1="19" x2="59" y2="62" stroke="#00C26F" stroke-width="2.5" stroke-linecap="round" />
    <line x1="45" y1="19" x2="72" y2="62" stroke="#00C26F" stroke-width="2.5" stroke-linecap="round" />
    <line x1="45" y1="19" x2="85" y2="62" stroke="#00C26F" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Deck -->
    <rect x="2" y="62" width="86" height="6.5" rx="3.25" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2" />
    
    <!-- Piers -->
    <path d="M 10 82 L 21 69 L 32 82" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 58 82 L 69 69 L 80 82" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Baseline -->
    <line x1="2" y1="83" x2="88" y2="83" stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Typography -->
  <text x="102" y="58" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-weight="700" font-size="44" letter-spacing="-1">
    <tspan fill="#F8FAFC">Vyapar</tspan>
    <tspan fill="#00C26F">Setu</tspan>
  </text>
</svg>
